# Las pruebas corren solas en GitHub, en cada push y en cada pull request (Práctica 10).
# Usan SQLite y carpetas temporales: no hace falta ninguna base de datos ni secreto.
name: pruebas
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
