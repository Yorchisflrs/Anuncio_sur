<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#224199">
  <meta name="robots" content="noindex">
  <title>Sin conexión · AvisoSur</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 16px;
      background: #f0f4fb; color: #132750; font: 16px/1.6 system-ui, sans-serif; }
    main { width: min(100%, 420px); padding: 24px; border: 1px solid #cad7ed;
      background: #fff; border-radius: 20px; }
    img { width: 56px; height: 56px; border-radius: 12px; }
    h1 { font-size: clamp(28px, 7vw, 36px); line-height: 1.15; margin: 16px 0 8px; }
    p { margin: 0 0 16px; }
    a { display: flex; min-height: 48px; align-items: center; width: 100%; border: 0;
      border-radius: 10px; font: inherit; font-weight: 650; padding: 8px 12px; }
    a { color: #224199; }
    .retry { background: #224199; color: white; justify-content: center; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/pwa-192.png" alt="AvisoSur" width="56" height="56">
    <h1>Sin conexión</h1>
    <p>Vuelve a conectarte para consultar avisos, entrar en tu cuenta o completar una publicación.</p>
    <a class="retry" href="/">Volver al inicio</a>
    <p><a href="/ayuda/seguridad">Abrir los consejos si ya los visitaste</a></p>
  </main>
</body>
</html>
